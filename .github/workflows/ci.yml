name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  rom:
    # The release ROM is byte-reproducible with the macOS GBDK build (Linux SDCC allocates registers differently).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gbdk-4.5.0
          key: gbdk-4.5.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-gbdk.sh') }}
      - run: sh tools/install-gbdk.sh
      - run: npm ci
      - name: Build and compare with the release ROM
        run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: |
            build/crucible.gbc
            build/crucible.noi
            build/crucible.map
            build/obj/*.o
            build/obj/*.lst
          retention-days: 7

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gbdk-4.5.0
          key: gbdk-4.5.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-gbdk.sh') }}
      - run: sh tools/install-gbdk.sh
      - run: pip install -r requirements.txt
      - name: Host tests (ASan, UBSan)
        run: CC=clang sh tools/core-tests.sh test
      - name: SM83 size and helper checks
        run: sh tools/core-tests.sh sm83
      - name: Scenarios on the host and on an SM83 core
        run: PYTHON=python sh tools/core-tests.sh sm83-test

  harness:
    needs: rom
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness: [flow, link, discoveries, overlay, lost_piece, crux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: rom
          path: build
      - name: Play ${{ matrix.harness }}
        run: python test/harness/capture_${{ matrix.harness }}.py build/crucible.gbc out/${{ matrix.harness }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.harness }}
          path: out/${{ matrix.harness }}
          retention-days: 7
