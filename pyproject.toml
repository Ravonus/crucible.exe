# Tooling configuration only; this repository is not a Python package.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["node_modules", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PL", "PTH", "ANN", "T20"]
ignore = [
  "PLR2004", # magic values: register addresses, screen ids and frame counts are the point of these scripts
  "PLR0913", # harness helpers mirror button/frame parameters
  "T201",    # the harnesses and simulators report on stdout
]

[tool.ruff.lint.per-file-ignores]
# The fight-system simulators are design research kept as their authors wrote them (formatted, safe autofixes
# applied); they are checked for correctness errors, not house style.
"docs/fight-system/sim/*.py" = ["ANN", "PL", "PTH", "UP", "C4", "N", "SIM", "RUF", "B007", "B905", "E501", "E731", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["test/harness", "core/test/sm83"]

[[tool.mypy.overrides]]
module = ["pyboy", "pyboy.*"]
ignore_missing_imports = true
